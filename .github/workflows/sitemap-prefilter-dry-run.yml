name: Dry-run sitemap + předfiltr relevance (bez zápisu)

# Stahuje jen homepage, robots.txt a soubory sitemap (žádné produktové stránky),
# z DB jen čte. Shopy běží paralelně na samostatných runnerech - rate limit
# 1 req / 3 s se drží pro každou doménu zvlášť.
on:
  workflow_dispatch:
    inputs:
      shop_ids:
        description: 'JSON pole shop id'
        required: false
        default: '["jawa-korda","motojelinek","motokramek"]'
        type: string

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shop_id: ${{ fromJSON(inputs.shop_ids) }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dry-run ${{ matrix.shop_id }}
        run: npx tsx scripts/dry-run-sitemap-prefilter.ts "${{ matrix.shop_id }}" --out="out/${{ matrix.shop_id }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefilter-${{ matrix.shop_id }}
          path: out/${{ matrix.shop_id }}

name: Dry-run importu feedu

on:
  workflow_dispatch:
    inputs:
      shop_id:
        description: 'ID shopu (shops.id)'
        required: true
        default: 'motomax'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      # createServiceRoleClient() čte NEXT_PUBLIC_SUPABASE_URL - GitHub Actions
      # běží mimo Vercel, takže URL a service role klíč jdou zvlášť z GH Secrets.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 'Dry-run: stáhne a naparsuje zdroj, nic nezapisuje'
        run: npx tsx scripts/import-feed.ts "${{ inputs.shop_id }}" --dry-run

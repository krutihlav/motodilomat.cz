name: Analýza předfiltru z artefaktů (bez requestů na shopy)

# Čte artefakty dry-run-sitemap-prefilter (sitemap-urls.txt) a z DB jen URL/názvy
# pro výpočet recallu. Na e-shopy neposílá žádné requesty.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID běhu sitemap-prefilter-dry-run, odkud se berou artefakty'
        required: true
        default: '37688989764'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shop_id: [jawa-korda, motojelinek, motokramek]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prefilter-${{ matrix.shop_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: art/${{ matrix.shop_id }}

      - name: Analýza ${{ matrix.shop_id }}
        run: npx tsx scripts/analyze-prefilter.ts "${{ matrix.shop_id }}" --dir="art/${{ matrix.shop_id }}" | tee analysis.txt

      - uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.shop_id }}
          path: analysis.txt

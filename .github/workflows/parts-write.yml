name: Zápis dílů ze shluků A (parts)

# Jen ruční spuštění. Dvoufázově:
#  1) confirm_write=false (výchozí) -> jen dry-run, do logu vypíše seznam dílů, nic se nezapíše,
#  2) po kontrole seznamu znovu s confirm_write=true -> job write zapíše parts, part_models
#     a shop_products.part_id (match_status=auto). Vyžaduje migraci 015.
# Skript je idempotentní, při pádu stačí pustit znovu.
on:
  workflow_dispatch:
    inputs:
      confirm_write:
        description: 'Zapsat díly do DB (až po kontrole seznamu z dry-runu)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seznam dílů (dry-run, bez --write)
        run: |
          set -o pipefail
          npx tsx scripts/write-parts.ts 2>&1 | tee parts-dry-run.log
      # Konec logu i jako anotace – čitelné přes API, i když logy nejdou stáhnout.
      - name: Shrnutí do anotací
        if: always()
        run: |
          msg=$(tail -c 3000 parts-dry-run.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=parts dry-run (konec logu)::$msg"
          head=$(head -c 3000 parts-dry-run.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=parts dry-run (začátek logu)::$head"

  write:
    needs: dry-run
    if: ${{ inputs.confirm_write }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Zápis (--write)
        run: |
          set -o pipefail
          npx tsx scripts/write-parts.ts --write 2>&1 | tee parts-write.log
      - name: Shrnutí do anotací
        if: always()
        run: |
          msg=$(tail -c 3000 parts-write.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=parts write (konec logu)::$msg"

name: Dry-run shlukování nabídek (read-only)

# Jen čte shop_products a shop_product_models. Nic nezapisuje. Report jde celý do logu.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Páry A/B mezi shopy
        run: npx tsx scripts/dry-run-clusters.ts --out clusters-report.md

      # Shrnutí reportu i jako anotace – čitelné přes API i tam, kde nejdou stáhnout artefakty.
      - name: Shrnutí do anotací
        run: |
          for i in 0 1 2 3 4 5; do
            chunk=$(head -c $(( (i+1)*3000 )) clusters-report.md | tail -c 3000)
            [ -z "$chunk" ] && break
            msg=$(printf '%s' "$chunk" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=clusters-report part $i::$msg"
            if [ $(( (i+1)*3000 )) -ge $(wc -c < clusters-report.md) ]; then break; fi
          done
          true

      - uses: actions/upload-artifact@v4
        with:
          name: clusters-dry-run-report
          path: clusters-report.md

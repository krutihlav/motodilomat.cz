name: Probe shopů pro crawl

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      # createServiceRoleClient() čte NEXT_PUBLIC_SUPABASE_URL - GitHub Actions
      # běží mimo Vercel, takže URL a service role klíč jdou zvlášť z GH Secrets.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe shopů s vyplněným base_url
        run: npx tsx scripts/probe-shops.ts

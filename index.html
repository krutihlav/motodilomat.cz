<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MotoDílomat.cz – Srovnávač dílů pro dvoutakty z ČSSR • Na jedno šlápnutí</title>
    <meta name="description" content="MotoDílomat.cz – Nezávislý srovnávač cen náhradních dílů pro Jawa, ČZ, Babetta a Stadion. Srovnání e-shopů Fichtlkrámek, Motokrámek, Motomax s rozkresy a optimalizátorem košíku." />
    
    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MotoDílomat.cz – Srovnávač dílů pro dvoutakty z ČSSR" />
    <meta property="og:description" content="Najděte a porovnejte všechny náhradní díly na motocykly Jawa, ČZ, Babetta i Stadion napříč českými e-shopy na jednom místě. Na jedno šlápnutí." />
    <meta property="og:site_name" content="MotoDílomat" />
    <meta property="og:locale" content="cs_CZ" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MotoDílomat.cz – Srovnávač dílů pro dvoutakty z ČSSR" />
    <meta name="twitter:description" content="Kompletní katalog a srovnání cen dílů na Pionýr, Pérák, Kývačku, Panelku i ČZ z ověřených moto e-shopů." />

    <!-- Google Fonts for authentic craftsmanship -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://motodilomat.cz/#website",
          "url": "https://motodilomat.cz/",
          "name": "MotoDílomat",
          "description": "Specializovaný cenový srovnávač a katalog náhradních dílů pro dvoutakty z ČSSR",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://motodilomat.cz/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "name": "MotoDílomat - Cenový vyhledávač",
          "applicationCategory": "ShoppingApplication",
          "operatingSystem": "All",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "CZK",
            "lowPrice": "15",
            "highPrice": "14500",
            "offerCount": "18500"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#F8F9FA] text-[#1E293B] antialiased selection:bg-[#8B1E1E] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
